# Render Blueprint — create the API with "New → Blueprint" pointing at this repo
services:
  - type: web
    name: bangladesh-landscape-api
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false # paste your Atlas connection string
      - key: CLIENT_URL
        sync: false # your Vercel URL, e.g. https://bangladesh-landscape.vercel.app
      - key: SERVER_URL
        sync: false # this service's public URL, e.g. https://bangladesh-landscape-api.onrender.com
      - key: GEMINI_API_KEY
        sync: false # free key from https://aistudio.google.com/apikey
